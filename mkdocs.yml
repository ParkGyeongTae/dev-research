site_name: 개발 리서치 노트
site_description: 데이터 엔지니어링·개발 전반 학습 리서치 정리
site_url: https://parkgyeongtae.github.io/dev-research/
repo_url: https://github.com/ParkGyeongTae/dev-research
repo_name: dev-research

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - tables
  - footnotes
  - admonition
  - pymdownx.details      # 접히는 admonition — 긴 로그·부연 설명을 접어두는 데 씀
  - pymdownx.superfences  # 코드 블록 중첩 + mermaid 다이어그램
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true
